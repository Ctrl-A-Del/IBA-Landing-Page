name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Verify Legal page documents
        run: |
          for route in impressum datenschutz; do
            f="dist/$route/index.html"
            test -f "$f" || { echo "Missing $f"; exit 1; }
            grep -q 'static/css/main\.' "$f" || { echo "$f does not reference the stylesheet bundle"; exit 1; }
          done
